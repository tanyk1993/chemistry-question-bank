<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H2 Chem Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3f6f8; --card:#ffffff; --ink:#14202e; --muted:#5b6b7a;
    --line:#dde3e9; --teal:#0e7490; --teal-soft:#e2f1f4;
    --green:#137a52; --green-soft:#e2f2ea; --amber:#b45309;
    --focus:#0e7490;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  a{color:var(--teal)}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:.7rem;
    padding:.9rem 1.25rem;border-bottom:1px solid var(--line);
    background:var(--card);position:sticky;top:0;z-index:5;
  }
  .mark{width:26px;height:26px;color:var(--teal);flex:none}
  .brand{font-weight:700;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-weight:500}
  header .spacer{flex:1}
  .whoami{color:var(--muted);font-size:.85rem;margin-right:.25rem}
  .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:.4rem .7rem;border-radius:7px;font-size:.85rem;font-weight:500;
  }
  .btn-ghost:hover{border-color:var(--muted)}

  /* ---------- layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:1.5rem 1.25rem 4rem;
       display:grid;grid-template-columns:260px 1fr;gap:1.5rem}
  @media (max-width:760px){main{grid-template-columns:1fr;gap:1rem}}

  .filters{position:sticky;top:73px;align-self:start;display:flex;flex-direction:column;gap:1.1rem}
  @media (max-width:760px){.filters{position:static}}
  .filters label{display:block;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:.4rem}
  .search-box input,select{
    width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;
    background:var(--card);font:inherit;color:var(--ink)
  }
  .search-box input::placeholder{color:#9aa7b3}
  .count{font-size:.85rem;color:var(--muted)}
  .count b{color:var(--ink)}

  /* ---------- question cards ---------- */
  .results{display:flex;flex-direction:column;gap:.9rem;min-height:40vh}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1.05rem 1.15rem;display:flex;flex-direction:column;gap:.75rem}
  .qhead{display:flex;align-items:flex-start;gap:.7rem;flex-wrap:wrap}
  .qno{font-family:"IBM Plex Mono";font-size:.78rem;color:var(--muted);
    padding-top:.35rem;min-width:2.2rem}
  /* periodic-cell topic badge */
  .cell{display:inline-flex;flex-direction:column;justify-content:space-between;
    width:auto;min-width:3.1rem;padding:.28rem .45rem;border-radius:7px;
    border:1.5px solid var(--teal);background:var(--teal-soft);line-height:1.1}
  .cell.organic{border-color:var(--green);background:var(--green-soft)}
  .cell .c-code{font-family:"IBM Plex Mono";font-weight:600;font-size:.95rem;color:var(--teal)}
  .cell.organic .c-code{color:var(--green)}
  .cell .c-name{font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);max-width:8rem}
  .los{display:flex;flex-wrap:wrap;gap:.35rem;margin-left:auto;align-items:flex-start}
  .lo{font-family:"IBM Plex Mono";font-size:.75rem;padding:.18rem .4rem;border-radius:5px;
    background:var(--paper);border:1px solid var(--line);color:var(--ink);cursor:help}
  .stem{font-size:.98rem}
  .source{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.02em;
    color:var(--muted);margin:-.1rem 0 .25rem;line-height:1.35}
  .source>div{font-weight:600;color:var(--ink)}
  .source .source-sub{font-weight:400;color:var(--muted)}
  .stem .figimg{margin:.6rem 0;text-align:center}
  .stem .figimg img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px}
  .stem .optgrid{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0}
  .stem .optrow{display:flex;gap:.6rem;align-items:center;background:var(--paper);
    border-radius:8px;padding:.5rem .6rem}
  .stem .optrow b{font-family:"IBM Plex Mono";color:var(--muted);flex:none}
  .stem .optrow img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
  /* formatted display layer */
  .stem .el{font-family:"Times New Roman",Georgia,serif;font-style:italic}
  .stem .opts{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem}
  .stem .opt{padding:.4rem .6rem;background:var(--paper);border-radius:7px;line-height:1.6}
  .stem .opt b{font-family:"IBM Plex Mono";color:var(--muted);margin-right:.5rem}
  .stem ol.stmts{margin:.5rem 0;padding-left:1.6rem}
  .stem ol.stmts li{margin:.15rem 0}
  .stem .fig{display:block;font-size:.82rem;color:#8a97a3;background:#eef2f5;
    border:1px dashed #c4ced6;border-radius:7px;padding:.4rem .6rem;margin:.5rem 0}
  .stem .muted{color:var(--muted);font-size:.88rem;margin-top:.3rem}
  table.qt{border-collapse:collapse;margin:.6rem 0;font-size:.9rem;width:100%}
  table.qt th,table.qt td{border:1px solid var(--line);padding:.35rem .55rem;text-align:center;vertical-align:top}
  table.qt th{background:var(--paper);font-weight:600}
  .stem math{font-size:1.05em;vertical-align:middle}
  table.opt2col{border-collapse:separate;border-spacing:0 .35rem;width:100%;margin:.5rem 0}
  table.opt2col td{background:var(--paper);padding:.45rem .55rem;vertical-align:baseline}
  table.opt2col td.l{font-family:"IBM Plex Mono";color:var(--muted);width:1.4rem;border-radius:7px 0 0 7px}
  table.opt2col td.eq{width:100%}
  table.opt2col td.dh{color:var(--muted);white-space:nowrap;border-radius:0 7px 7px 0}
  .opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
  .opts li{display:flex;gap:.55rem;padding:.4rem .55rem;border:1px solid transparent;
    border-radius:7px;background:var(--paper);font-size:.92rem}
  .opts li .k{font-family:"IBM Plex Mono";font-weight:600;color:var(--muted);flex:none}
  .opts li.correct{background:var(--green-soft);border-color:var(--green)}
  .opts li.correct .k{color:var(--green)}
  .qfoot{display:flex;align-items:center;gap:.6rem}
  .reveal{background:transparent;border:1px solid var(--line);border-radius:7px;
    padding:.35rem .65rem;font-size:.8rem;font-weight:500;color:var(--teal)}
  .reveal:hover{border-color:var(--teal)}
  .ans-tag{font-family:"IBM Plex Mono";font-size:.8rem;color:var(--green);font-weight:600;display:none}

  .empty,.loading{text-align:center;color:var(--muted);padding:3rem 1rem;
    border:1px dashed var(--line);border-radius:12px;background:var(--card)}
  .empty b{color:var(--ink)}

  /* ---------- login ---------- */
  .gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
  .login{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:1.75rem}
  .login .mark{width:34px;height:34px;margin-bottom:.75rem}
  .login h1{font-size:1.25rem;margin:.1rem 0 .3rem}
  .login p{color:var(--muted);font-size:.9rem;margin:0 0 1.25rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:600;margin-bottom:.35rem}
  .field input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;font:inherit}
  .btn-primary{width:100%;background:var(--teal);color:#fff;border:none;border-radius:9px;
    padding:.7rem;font-weight:600;font-size:.95rem;margin-top:.4rem}
  .btn-primary:hover{background:#0b5c73}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:.6rem}
  .btn-google svg{background:#fff;border-radius:3px;padding:2px}
  .msg{font-size:.85rem;margin-top:.8rem;min-height:1.1rem}
  .msg.error{color:#b42318}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- benzene-ring mark, reused in header + login -->
<template id="mark">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <path d="M12 2.4 20.3 7v10L12 21.6 3.7 17V7z"/><circle cx="12" cy="12" r="4.3"/>
  </svg>
</template>

<!-- ============ LOGIN GATE ============ -->
<div id="gate" class="gate">
  <div class="login">
    <span data-mark></span>
    <h1>H2 Chem Question Bank</h1>
    <p>Sign in with your VJC Google account to search the bank.</p>
    <button id="signin" class="btn-primary btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#fff" d="M17.6 9.2c0-.6-.05-1.18-.16-1.74H9v3.3h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.64-3.88 2.64-6.54z" opacity=".0"/><path fill="#EA4335" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#4285F4" d="M17.6 9.2c0-.6-.05-1.18-.16-1.74H9v3.3h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.64-3.88 2.64-6.54z"/><path fill="#FBBC05" d="M3.96 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.95H.94A9 9 0 0 0 0 9c0 1.45.35 2.82.94 4.05l3.02-2.33z"/><path fill="#34A853" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.9 11.43 0 9 0A9 9 0 0 0 .94 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      <span>Sign in with Google</span>
    </button>
    <div id="loginmsg" class="msg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <span data-mark></span>
    <div class="brand">H2 Chem <span>Question Bank</span></div>
    <div class="spacer"></div>
    <span id="whoami" class="whoami"></span>
    <button id="signout" class="btn-ghost">Sign out</button>
  </header>
  <main>
    <aside class="filters">
      <div class="search-box">
        <label for="kw">Search</label>
        <input id="kw" type="search" placeholder="reagent, formula, term…" autocomplete="off">
      </div>
      <div>
        <label for="topic">Topic</label>
        <select id="topic"><option value="">All topics</option></select>
      </div>
      <div class="count" id="count"></div>
    </aside>
    <section class="results" id="results">
      <div class="loading">Loading questions…</div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- config (anon key is safe in frontend; RLS guards the data) ----
  const SUPABASE_URL  = "https://pnnbbnumcnalpbipovik.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBubmJibnVtY25hbHBiaXBvdmlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMzM3MDUsImV4cCI6MjA5ODgwOTcwNX0.jn7rl9loylSuS_gNYqSmJQctQD2BvAd1tryITEQ858I";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // paint the benzene mark into every placeholder
  const markHTML = document.getElementById('mark').innerHTML;
  document.querySelectorAll('[data-mark]').forEach(el => el.innerHTML = markHTML);

  const $ = s => document.querySelector(s);
  const gate = $('#gate'), app = $('#app');
  let ALL = [];  // loaded questions

  // ---------------- auth ----------------
  async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    session ? enterApp(session) : showGate();
  }
  function showGate(){ app.classList.add('hidden'); gate.classList.remove('hidden'); }
  async function enterApp(session){
    gate.classList.add('hidden'); app.classList.remove('hidden');
    $('#whoami').textContent = session.user.email || '';
    await loadQuestions();
  }
  $('#signin').addEventListener('click', signIn);
  async function signIn(){
    const msg = $('#loginmsg'); msg.textContent=''; msg.className='msg';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    // on success the browser redirects to Google; we only reach here on error
    if(error){ msg.textContent = "Couldn't start Google sign-in — please try again."; msg.className='msg error'; }
  }
  $('#signout').addEventListener('click', async ()=>{ await sb.auth.signOut(); ALL=[]; showGate(); });

  // ---------------- data ----------------
  async function loadQuestions(){
    const results = $('#results');
    results.innerHTML = '<div class="loading">Loading questions…</div>';
    const { data, error } = await sb
      .from('questions')
      .select(`id, question_number, content_text, content_html, options, answer_key, status,
               papers ( school, year, level, paper_number ),
               question_assets ( storage_path, slot, ordinal ),
               question_topics ( topics ( code, name, ordinal ) ),
               question_los ( learning_objectives ( section_code, text ) )`)
      .eq('status','approved')
      .order('question_number');
    if(error){
      results.innerHTML = '<div class="empty"><b>Couldn\'t load questions.</b><br>'+
        'Check your connection and that you\'re signed in, then reload.</div>';
      console.error(error); return;
    }
    const assetUrl = p => sb.storage.from('question-assets').getPublicUrl(p).data.publicUrl;
    ALL = (data||[]).map(q => ({
      ...q,
      paper: q.papers || null,
      assets: (q.question_assets||[])
        .slice().sort((a,b)=>(a.ordinal||0)-(b.ordinal||0))
        .map(a => ({ ...a, url: assetUrl(a.storage_path) })),
      topics: (q.question_topics||[]).map(x=>x.topics).filter(Boolean),
      los: (q.question_los||[]).map(x=>x.learning_objectives).filter(Boolean)
    }));
    buildTopicFilter(); render();
  }
  function buildTopicFilter(){
    const seen = new Map();
    ALL.forEach(q => q.topics.forEach(t => seen.set(t.code, t)));
    const topics = [...seen.values()].sort((a,b)=>(a.ordinal||0)-(b.ordinal||0));
    const sel = $('#topic');
    topics.forEach(t=>{
      const o=document.createElement('option');
      o.value=t.code; o.textContent=`${t.code} — ${t.name}`; sel.appendChild(o);
    });
  }

  // ---------------- render + filter ----------------
  $('#kw').addEventListener('input', render);
  $('#topic').addEventListener('change', render);

  function render(){
    const kw = $('#kw').value.trim().toLowerCase();
    const tc = $('#topic').value;
    const box = $('#results');
    if(!kw && !tc){                       // blank default: nothing until the user picks/searches
      $('#count').innerHTML = `<b>${ALL.length}</b> question${ALL.length===1?'':'s'} in the bank`;
      box.innerHTML = '<div class="empty"><b>Pick a topic or type a search to begin.</b><br>'+
        'Filter by topic on the left, or search for a reagent, formula, or term.</div>';
      return;
    }
    const shown = ALL.filter(q=>{
      if(tc && !q.topics.some(t=>t.code===tc)) return false;
      if(!kw) return true;
      const hay = [
        q.content_text,
        Object.values(q.options||{}).join(' '),
        q.los.map(l=>l.section_code+' '+l.text).join(' '),
        q.topics.map(t=>t.name).join(' ')
      ].join(' ').toLowerCase();
      return hay.includes(kw);
    });
    $('#count').innerHTML = `<b>${shown.length}</b> of ${ALL.length} question${ALL.length===1?'':'s'}`;
    if(!shown.length){
      box.innerHTML = '<div class="empty"><b>No questions match.</b><br>'+
        'Try a broader keyword or a different topic.</div>';
      return;
    }
    box.innerHTML = '';
    shown.forEach(q => box.appendChild(card(q)));
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

  function card(q){
    const el = document.createElement('article'); el.className='qcard';

    const head = document.createElement('div'); head.className='qhead';
    q.topics.forEach(t=>{
      const organic = String(t.code).startsWith('11');
      head.insertAdjacentHTML('beforeend',
        `<span class="cell ${organic?'organic':''}">
           <span class="c-code">${esc(t.code)}</span>
           <span class="c-name">${esc(t.name)}</span>
         </span>`);
    });
    if(q.los.length){
      const los = document.createElement('div'); los.className='los';
      q.los.forEach(l=>{
        const s=document.createElement('span'); s.className='lo';
        s.textContent=l.section_code; s.title=l.text||''; los.appendChild(s);
      });
      head.appendChild(los);
    }
    el.appendChild(head);

    if(q.paper){
      const p=q.paper;
      const l1=[p.school, p.year].filter(Boolean).join(' ');
      const l2=[p.level, p.paper_number?'P'+p.paper_number:null,
                q.question_number?'Q'+q.question_number:null].filter(Boolean).join(' ');
      if(l1||l2){
        const src=document.createElement('div'); src.className='source';
        if(l1){ const a=document.createElement('div'); a.textContent=l1; src.appendChild(a); }
        if(l2){ const b=document.createElement('div'); b.className='source-sub'; b.textContent=l2; src.appendChild(b); }
        el.appendChild(src);
      }
    }

    const stem=document.createElement('div'); stem.className='stem';
    if(q.content_html){ stem.innerHTML=q.content_html; }   // formatted display layer
    else stem.textContent=q.content_text||'';

    // place linked figures: stem images fill the "image pending" slots; option images become a grid
    if(q.assets && q.assets.length){
      const isOpt = s => /^[A-E]$/.test(s||'');
      const stemImgs = q.assets.filter(a => !isOpt(a.slot));
      const optImgs  = q.assets.filter(a =>  isOpt(a.slot))
                                .sort((a,b)=> (a.slot>b.slot?1:-1));
      const figImg = a => {
        const w=document.createElement('div'); w.className='figimg';
        const im=document.createElement('img'); im.src=a.url; im.loading='lazy'; im.alt='';
        w.appendChild(im); return w;
      };
      const optGrid = () => {
        const g=document.createElement('div'); g.className='optgrid';
        optImgs.forEach(a=>{
          const row=document.createElement('div'); row.className='optrow';
          const b=document.createElement('b'); b.textContent=a.slot;
          const im=document.createElement('img'); im.src=a.url; im.loading='lazy'; im.alt='';
          row.appendChild(b); row.appendChild(im); g.appendChild(row);
        });
        return g;
      };
      const figs=[...stem.querySelectorAll('.fig')];
      let si=0, gridPlaced=false;
      figs.forEach(f=>{
        if(si < stemImgs.length){ f.replaceWith(figImg(stemImgs[si++])); }
        else if(optImgs.length && !gridPlaced){ f.replaceWith(optGrid()); gridPlaced=true; }
        else f.remove();
      });
      while(si < stemImgs.length) stem.appendChild(figImg(stemImgs[si++]));  // extra stem figs
      if(optImgs.length && !gridPlaced) stem.appendChild(optGrid());          // options had no slot
    }
    el.appendChild(stem);

    const opts=q.options||{};
    if(!q.content_html && Object.keys(opts).length){
      const ul=document.createElement('ul'); ul.className='opts';
      ['A','B','C','D','E'].forEach(k=>{
        if(opts[k]==null) return;
        const li=document.createElement('li'); li.dataset.k=k;
        li.innerHTML=`<span class="k">${k}</span><span>${esc(opts[k])}</span>`;
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }

    if(q.answer_key){
      const foot=document.createElement('div'); foot.className='qfoot';
      const btn=document.createElement('button'); btn.className='reveal'; btn.textContent='Show answer';
      const tag=document.createElement('span'); tag.className='ans-tag';
      tag.textContent='Answer: '+q.answer_key;
      btn.addEventListener('click',()=>{
        const on = tag.style.display!=='inline';
        tag.style.display = on?'inline':'none';
        btn.textContent = on?'Hide answer':'Show answer';
        if(!q.content_html) el.querySelectorAll('.opts li').forEach(li=>
          li.classList.toggle('correct', on && li.dataset.k===q.answer_key));
      });
      foot.appendChild(btn); foot.appendChild(tag); el.appendChild(foot);
    }
    return el;
  }

  sb.auth.onAuthStateChange((_e, session)=>{
    if(!session){ showGate(); }
    else if(!gate.classList.contains('hidden')){ enterApp(session); }  // just returned from Google
  });
  boot();
</script>
</body>
</html>
