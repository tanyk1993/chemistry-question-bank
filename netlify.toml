[build]
  # TEMPORARY (2026-11-21): the old "skip unless index.html changed" ignore rule
  # cancelled the favicon deploys (21bfbc5, 83a7060, 4c30bb4) even though
  # index.html had changed, because CACHED_COMMIT_REF was not what we assumed
  # (every build logs "Failed to fetch cache"). This command never skips (exit 1
  # = build) and just prints the refs so the deploy log shows their real values.
  # Original rule, to restore once understood:
  #   git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html
  ignore = "echo CACHED_COMMIT_REF=[$CACHED_COMMIT_REF] COMMIT_REF=[$COMMIT_REF]; exit 1"
