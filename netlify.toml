[build]
  # Skip the deploy unless the pushed commit touched something that is served:
  # index.html, the favicon files, or this file. ingest/-only commits (extraction
  # code, migrations, notes) then cost no Netlify build.
  # `git diff --quiet` exits 0 (no diff) -> Netlify skips; exit 1 (diff) -> builds.
  # Any git error (e.g. no parent commit) is non-zero too, so it fails safe: build.
  #
  # Compares HEAD~1 to HEAD rather than $CACHED_COMMIT_REF: on 2026-11-21 Netlify
  # logged "Failed to fetch cache" and the $CACHED_COMMIT_REF rule wrongly skipped
  # three commits that changed index.html. Trade-off: only the LAST commit of a
  # push is inspected, so if one push holds several commits and an earlier one
  # changed index.html, trigger a manual deploy (Deploys > Trigger deploy).
  ignore = "git diff --quiet HEAD~1 HEAD -- index.html favicon.svg favicon.ico apple-touch-icon.png netlify.toml"
